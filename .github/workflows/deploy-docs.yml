name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'docsite/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docsite/package-lock.json

      - name: Sync docs content
        run: |
          cp README.md docsite/docs/overview.md
          cp docs/api-docs.md docsite/docs/api-docs.md
          cp docs/deployment.md docsite/docs/deployment.md

          # Rewrite repo-relative links so they resolve inside the VitePress site.
          sed -i 's#docs/api-docs\.md#./api-docs#g' docsite/docs/overview.md
          sed -i 's#docs/deployment\.md#./deployment#g' docsite/docs/overview.md
          sed -i 's#docs/smoke-test\.ps1#https://github.com/cnniranjan72/Flux/blob/main/docs/smoke-test.ps1#g' docsite/docs/overview.md
          sed -i 's#docs/erp-crm\.postman_collection\.json#https://github.com/cnniranjan72/Flux/blob/main/docs/erp-crm.postman_collection.json#g' docsite/docs/overview.md
          sed -i 's#http://localhost:5173#\`http://localhost:5173\`#g' docsite/docs/overview.md
          sed -i 's#\.\./README#./overview#g' docsite/docs/deployment.md
          ls -la docsite/docs/

      - name: Install
        working-directory: docsite
        run: npm ci

      - name: Build
        working-directory: docsite
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docsite/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
